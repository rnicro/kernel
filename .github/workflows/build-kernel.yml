name: Build optimized Void Linux kernel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-kernel.yml"
      - "config/**"
      - "scripts/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      package:
        description: "Void kernel package template"
        required: true
        default: "linux6.18"
        type: choice
        options:
          - linux6.18

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Build kernel package inside Void Linux
        env:
          KERNEL_PACKAGE: ${{ inputs.package || 'linux6.18' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker pull voidlinux/voidlinux:latest
          docker run --rm --privileged \
            -e KERNEL_PACKAGE="$KERNEL_PACKAGE" \
            -e BUILD_JOBS=4 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            voidlinux/voidlinux:latest sh /workspace/scripts/build-in-void.sh

      - name: Upload kernel packages
        uses: actions/upload-artifact@v4
        with:
          name: void-kernel-x86_64-skylake
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
