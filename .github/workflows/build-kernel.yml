name: Build optimized Void Linux kernel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-kernel.yml"
      - "scripts/**"
      - "README.md"
  workflow_dispatch:
    inputs:
      package:
        description: "Void kernel series to build"
        required: true
        default: "linux7.2"
        type: choice
        options:
          - linux7.2

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Build x86_64-musl kernel package inside Void Linux
        env:
          KERNEL_PACKAGE: ${{ inputs.package || 'linux7.2' }}
          BUILD_JOBS: 4
        run: |
          set -euo pipefail
          mkdir -p artifacts
          image="ghcr.io/void-linux/void-musl:20260901r1@sha256:5b01ccb49a601ba4a525d82841578055f8c5a48adabdfa1ad37c087ac0b01ce0"
          docker pull "$image"
          docker run --rm --cpus="$(nproc)" \
            -e KERNEL_PACKAGE="$KERNEL_PACKAGE" \
            -e BUILD_JOBS="$BUILD_JOBS" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$image" sh /workspace/scripts/build-in-void.sh

      - name: Upload installable kernel packages
        uses: actions/upload-artifact@v7
        with:
          name: void-kernel-x86_64-musl-skylake
          path: artifacts/*.xbps
          if-no-files-found: error
          retention-days: 14
